
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorldFace</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;
  --accent:#4f8ef7;--accent2:#f7634f;--green:#22d3a0;
  --text:#f0f4ff;--muted:#8892a4;--border:#1e2d45;
  --card:#131c2e;--pill:#1e2d45;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.app{display:flex;min-height:100vh;max-width:1100px;margin:0 auto}
/* sidebar */
.sidebar{width:220px;flex-shrink:0;padding:24px 16px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh}
.logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:all .2s}
.nav-item:hover,.nav-item.active{background:var(--bg3);color:var(--text)}
.nav-item.active .nav-icon{color:var(--accent)}
.nav-icon{font-size:18px;width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--accent2);color:#fff;font-size:10px;padding:2px 6px;border-radius:20px;font-weight:600}
.sidebar-footer{margin-top:auto;padding:12px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;gap:10px;cursor:pointer}
.sf-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.sf-name{font-size:13px;font-weight:500}
.sf-country{font-size:11px;color:var(--muted)}
/* main */
.main{flex:1;padding:24px 20px;max-width:680px}
/* right panel */
.right-panel{width:280px;flex-shrink:0;padding:24px 16px;border-left:1px solid var(--border);overflow-y:auto;max-height:100vh;position:sticky;top:0}
/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:24px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.story-ring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center}
.story-ring.add-ring{background:var(--bg3)}
.story-avatar{width:52px;height:52px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid var(--bg)}
.story-name{font-size:11px;color:var(--muted);text-align:center;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* post compose */
.compose{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px}
.compose-row{display:flex;gap:12px;align-items:flex-start}
.compose-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.compose-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;resize:none;outline:none;min-height:60px}
.compose-input::placeholder{color:var(--muted)}
.compose-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;align-items:center}
.c-btn{padding:7px 16px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif}
.c-btn.primary{background:var(--accent);color:#fff}
.c-btn.ghost{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.c-btn:disabled{opacity:.5;cursor:not-allowed}
.compose-ai{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);margin-right:auto;cursor:pointer;padding:4px 8px;border-radius:8px;transition:background .2s}
.compose-ai:hover{background:var(--bg3)}
/* post card */
.post{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px}
.post-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.post-avatar{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative}
.online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.post-meta{flex:1}
.post-name{font-size:14px;font-weight:600}
.post-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.flag{font-size:14px}
.post-time{margin-left:auto;font-size:11px;color:var(--muted)}
.post-body{font-size:14px;line-height:1.7;margin-bottom:14px;color:#ccd6f0}
.post-media{border-radius:12px;background:var(--bg3);width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:40px;position:relative;overflow:hidden}
.post-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:12px;padding:4px 10px;border-radius:20px;background:var(--pill);color:var(--muted)}
.tag.blue{background:rgba(79,142,247,.12);color:#7eb5ff}
.post-actions{display:flex;gap:4px;border-top:1px solid var(--border);padding-top:12px;margin-top:2px}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted);font-size:13px;transition:all .2s;border:none;background:none;font-family:'DM Sans',sans-serif}
.act-btn:hover{background:var(--bg3);color:var(--text)}
.act-btn.liked{color:#f7634f}
.act-btn.bookmarked{color:#f7c94f}
.translate-btn{font-size:12px;color:var(--accent);cursor:pointer;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:6px;border:1px solid rgba(79,142,247,.3);transition:background .2s}
.translate-btn:hover{background:rgba(79,142,247,.08)}
.translated-text{font-size:13px;color:var(--muted);background:rgba(79,142,247,.06);border-left:3px solid var(--accent);padding:10px;border-radius:0 8px 8px 0;margin-bottom:10px;line-height:1.6}
/* sections */
.section-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px;margin-top:28px}
/* suggestions */
.suggest-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.sug-avatar{width:40px;height:40px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sug-name{font-size:13px;font-weight:600}
.sug-sub{font-size:11px;color:var(--muted)}
.follow-btn{margin-left:auto;padding:6px 14px;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.follow-btn:hover,.follow-btn.following{background:var(--accent);color:#fff;border-color:var(--accent)}
/* trending */
.trend{padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.trend:last-child{border-bottom:none}
.trend-tag{font-size:13px;font-weight:600;color:var(--accent)}
.trend-posts{font-size:11px;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--bg3);border-radius:12px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:8px;text-align:center;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .2s}
.tab.active{background:var(--card);color:var(--text)}
/* world stats */
.world-bar{display:flex;gap:12px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.world-bar::-webkit-scrollbar{display:none}
.wstat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;flex-shrink:0;min-width:100px;text-align:center}
.wstat-num{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;color:var(--accent)}
.wstat-label{font-size:11px;color:var(--muted);margin-top:2px}
/* notification */
.notif{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s;border-radius:10px}
.notif:hover{background:var(--bg3)}
.notif.unread{background:rgba(79,142,247,.05)}
.notif-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.notif-text{font-size:13px;line-height:1.5;flex:1}
.notif-time{font-size:11px;color:var(--muted)}
/* messages */
.msg-list{display:flex;flex-direction:column;gap:2px}
.msg-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:background .2s}
.msg-item:hover,.msg-item.active{background:var(--bg3)}
.msg-av{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative}
.msg-name{font-size:14px;font-weight:500}
.msg-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.msg-meta{margin-left:auto;text-align:right}
.msg-time{font-size:11px;color:var(--muted)}
.msg-unread{background:var(--accent);color:#fff;font-size:10px;padding:2px 6px;border-radius:20px;font-weight:700;margin-top:4px;display:inline-block}
.chat-box{display:flex;flex-direction:column;height:400px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.chat-bubble{max-width:70%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6}
.chat-bubble.them{background:var(--bg3);border-bottom-left-radius:4px;align-self:flex-start}
.chat-bubble.me{background:var(--accent);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chat-input-row{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border);align-items:center}
.chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:8px 16px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:16px;flex-shrink:0}
/* loader */
.loading{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:12px}
.dot-pulse{display:flex;gap:4px}
.dot-pulse span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse .8s infinite alternate}
.dot-pulse span:nth-child(2){animation-delay:.2s}
.dot-pulse span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%{opacity:.3}100%{opacity:1}}
/* explore */
.explore-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.explore-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:all .2s}
.explore-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.explore-emoji{font-size:28px;margin-bottom:10px}
.explore-title{font-size:14px;font-weight:600;margin-bottom:4px}
.explore-count{font-size:12px;color:var(--muted)}
/* profile */
.profile-header{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px;text-align:center}
.profile-big-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--green));display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 16px}
.profile-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:700}
.profile-bio{font-size:14px;color:var(--muted);line-height:1.6;margin:8px 0 16px}
.profile-stats{display:flex;justify-content:center;gap:32px}
.pstat-num{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;text-align:center}
.pstat-label{font-size:12px;color:var(--muted);text-align:center}
/* scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
/* responsive */
@media(max-width:900px){
  .right-panel{display:none}
  .sidebar{width:60px}
  .sidebar .logo span,.nav-item span,.sf-name,.sf-country{display:none}
  .nav-item{justify-content:center;padding:10px}
  .main{padding:16px 12px}
}
@media(max-width:600px){
  .sidebar{display:none}
  .mobile-nav{display:flex}
}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:8px;gap:4px;z-index:100}
.mobile-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);font-size:10px;border:none;background:none;font-family:'DM Sans',sans-serif}
.mobile-nav-btn.active{color:var(--accent)}
.mobile-nav-icon{font-size:20px}
</style>
</head>

let state={tab:'home',likes:{},bookmarks:{},following:{},composing:'',aiLoading:false,translating:{},activeChat:0,chatMsg:'',chatMsgs:JSON.parse(JSON.stringify(MESSAGES))};

function switchTab(tab){
  state.tab=tab;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl=document.getElementById('nav-'+tab);
  if(navEl)navEl.classList.add('active');
  document.querySelectorAll('.mobile-nav-btn').forEach((el,i)=>{
    const tabs=['home','explore','messages','notifications','profile'];
    el.classList.toggle('active',tabs[i]===tab);
  });
  render();
}

async function callAI(prompt,system='You are WorldFace AI assistant. Reply concisely.'){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,system,messages:[{role:'user',content:prompt}]})});
  const d=await r.json();
  return d.content[0].text;
}

async function generateCaption(){
  state.aiLoading=true;render();
  try{
    const res=await callAI('Generate a short, engaging social media post (2-3 sentences) from Kenya for WorldFace platform. Include emojis and a hashtag. Write in Swahili mixed with English.',
    'You generate creative WorldFace posts. Be enthusiastic, culturally aware, and use African expressions naturally.');
    state.composing=res;
  }catch(e){state.composing='AI haikuwa na mtandao. Jaribu tena!';}
  state.aiLoading=false;render();
}

async function translatePost(id,text){
  state.translating[id]=true;render();
  try{
    const res=await callAI(`Translate this social media post to Swahili naturally (keep emojis, adapt culturally): "${text}"`,
    'You translate posts to Swahili naturally. Keep the tone, emojis, and cultural feel. Return only the translation.');
    const post=POSTS.find(p=>p.id===id);
    if(post)post.translated=res;
  }catch(e){
    const post=POSTS.find(p=>p.id===id);
    if(post)post.translated='Tafsiri haikufanikiwa. Jaribu tena.';
  }
  state.translating[id]=false;render();
}

async function sendChat(chatId){
  if(!state.chatMsg.trim())return;
  const chat=state.chatMsgs.find(c=>c.id===chatId);
  if(!chat)return;
  const userMsg=state.chatMsg;
  chat.messages.push({from:'me',text:userMsg,time:'Sasa'});
  state.chatMsg='';render();
  setTimeout(()=>{
    const input=document.getElementById('chat-input');
    if(input){input.value='';}
  },10);
  try{
    const res=await callAI(`You are ${chat.name} from ${chat.country}. Reply to: "${userMsg}" in 1-2 short sentences, friendly and natural. Mix English with a few words from your country's language.`,
    `You are ${chat.name}, a friendly WorldFace user. Keep replies short and warm.`);
    chat.messages.push({from:'them',text:res,time:'Sasa'});
  }catch(e){
    chat.messages.push({from:'them',text:'Samahani, mtandao haukufanya kazi vizuri 🙏',time:'Sasa'});
  }
  render();
  setTimeout(()=>{const cm=document.getElementById('chat-messages');if(cm)cm.scrollTop=cm.scrollHeight;},50);
}

function toggleLike(id){state.likes[id]=!state.likes[id];render();}
function toggleBookmark(id){state.bookmarks[id]=!state.bookmarks[id];render();}
function toggleFollow(id){state.following[id]=!state.following[id];render();}

}

function renderCompose(){

      <div class="compose-avatar">AK</div>
      <textarea class="compose-input" id="compose-ta" placeholder="Shiriki kitu na dunia... 🌍" oninput="state.composing=this.value;document.getElementById('post-btn').disabled=!this.value.trim()">${state.composing}</textarea>
    </div>
    <div class="compose-actions">
      <div class="compose-ai" onclick="generateCaption()">

      <button class="c-btn primary" id="post-btn" ${!state.composing.trim()?'disabled':''} onclick="state.composing='';render()">Chapisha</button>
    </div>

}

function renderPost(p){
  const liked=state.likes[p.id];
  const bk=state.bookmarks[p.id];
  const isTranslating=state.translating[p.id];
  return `<div class="post">
    <div class="post-header">
      <div class="post-avatar">${p.avatar}${p.online?'<div class="online-dot"></div>':''}</div>
      <div class="post-meta">
        <div class="post-name">${p.name} <span style="font-size:11px;color:var(--muted)">${p.country} ${p.city}</span></div>
        <div class="post-sub"><span>Wafuata 0</span></div>
      </div>
      <div class="post-time">${p.time}</div>
    </div>
    <div class="post-media" title="${p.mediaLabel}">
      <span style="font-size:60px">${p.media}</span>
      <div style="position:absolute;bottom:10px;left:12px;font-size:12px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.4);padding:3px 8px;border-radius:20px">${p.mediaLabel}</div>
    </div>
    ${p.translated?`<div class="translated-text">🌍 <em>${p.translated}</em></div>`:''}
    <div class="post-body">${p.body}</div>
    <div class="post-tags">${p.tags.map(t=>`<span class="tag blue">${t}</span>`).join('')}</div>
    ${!p.translated?`<div>${isTranslating?`<span class="translate-btn"><div class="dot-pulse"><span></span><span></span><span></span></div> Inatafsiri...</span>`:`<span class="translate-btn" onclick="translatePost(${p.id},'${p.translateSrc}')">🌐 Tafsiri kwa Kiswahili</span>`}</div>`:''}
    <div class="post-actions">
      <button class="act-btn ${liked?'liked':''}" onclick="toggleLike(${p.id})">❤️ ${liked?p.likes+1:p.likes}</button>
      <button class="act-btn">💬 ${p.comments}</button>
      <button class="act-btn">🔄 Shiriki</button>
      <button class="act-btn ${bk?'bookmarked':''}" onclick="toggleBookmark(${p.id})">🔖</button>
    </div>
  </div>`;
}

function renderHome(){
  return renderStories()+renderCompose()+
    `<div class="section-title">Mpasho wa Kimataifa</div>`+
    POSTS.map(renderPost).join('');
}

function renderMessages(){
  const activeChat=state.chatMsgs[state.activeChat];
  return `<div style="display:flex;gap:16px;height:500px">
    <div style="width:220px;flex-shrink:0;border-right:1px solid var(--border);padding-right:12px;overflow-y:auto">
      <div class="section-title" style="margin-top:0">Mazungumzo</div>
      <div class="msg-list">${state.chatMsgs.map((m,i)=>`<div class="msg-item ${state.activeChat===i?'active':''}" onclick="state.activeChat=${i};render()">
        <div class="msg-av">${m.avatar}</div>
        <div style="flex:1;min-width:0"><div class="msg-name">${m.name} ${m.country}</div><div class="msg-preview">${m.messages[m.messages.length-1].text}</div></div>
        <div class="msg-meta"><div class="msg-time">${m.time}</div>${m.unread?`<div class="msg-unread">${m.unread}</div>`:''}</div>
      </div>`).join('')}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden">
      <div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
        <div style="font-size:24px">${activeChat.avatar}</div>
        <div><div style="font-size:14px;font-weight:600">${activeChat.name} ${activeChat.country}</div><div style="font-size:12px;color:var(--green)">● Online</div></div>
      </div>
      <div class="chat-messages" id="chat-messages">
        ${activeChat.messages.map(m=>`<div class="chat-bubble ${m.from}">${m.text}<div style="font-size:10px;color:rgba(255,255,255,.4);margin-top:4px;text-align:right">${m.time}</div></div>`).join('')}
      </div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" placeholder="Andika ujumbe... 🌍" value="${state.chatMsg}" oninput="state.chatMsg=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat(${activeChat.id})}">
        <button class="send-btn" onclick="sendChat(${activeChat.id})">➤</button>
      </div>
    </div>
  </div>`;
}

function renderRightPanel(){
  if(state.tab==='messages'||state.tab==='profile')return'';
  return `<div>
    <div class="section-title" style="margin-top:0">Watu Unaofahamu</div>
    ${USERS.slice(0,3).map(u=>`<div class="suggest-card"><div class="sug-avatar">${u.avatar}</div><div><div class="sug-name">${u.name} ${u.country}</div><div class="sug-sub">${u.mutuals} marafiki</div></div><button class="follow-btn ${state.following[u.id]?'following':''}" onclick="toggleFollow(${u.id})">${state.following[u.id]?'✓':'+ Fuata'}</button></div>`).join('')}
    <div class="section-title">Trending Sasa</div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px">
      ${TRENDS.map(t=>`<div class="trend"><div class="trend-tag">${t.tag}</div><div class="trend-posts">${t.posts}</div></div>`).join('')}
    </div>
    <div class="section-title">Nchi Zinazounganishwa</div>
    <div style="font-size:22px;line-height:2">🇰🇪🇳🇬🇿🇦🇪🇹🇬🇭🇹🇿🇯🇵🇧🇷🇫🇷🇮🇳🇺🇸🇬🇧🇩🇪🇨🇳🇦🇷🇰🇷🇪🇬</div>
  </div>`;
}

function render(){
  const main=document.getElementById('main-content');
  const right=document.getElementById('right-panel');
  if(!main)return;
  switch(state.tab){
    case'home':main.innerHTML=renderHome();break;
    case'explore':main.innerHTML=renderExplore();break;
    case'messages':main.innerHTML=renderMessages();setTimeout(()=>{const cm=document.getElementById('chat-messages');if(cm)cm.scrollTop=cm.scrollHeight;},50);break;
    case'notifications':main.innerHTML=renderNotifications();break;
    case'profile':main.innerHTML=renderProfile();break;
  }
  if(right)right.innerHTML=renderRightPanel();
}

render();
</script>
